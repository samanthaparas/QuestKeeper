name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint --workspace questkeeper-frontend

      - name: Run tests
        run: npm run test --workspace questkeeper-frontend -- run

      - name: Build
        run: npm run build --workspace questkeeper-frontend

      - name: Run backend tests
        run: npm run test --workspace questkeeper-backend -- run

  # Installs the backend the same way Render does (its own lockfile, no
  # workspaces), so a stale questkeeper-backend/package-lock.json fails here
  # instead of breaking the deploy.
  backend-deploy-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: questkeeper-backend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 25

      - name: Install like Render
        run: npm ci --workspaces=false

      - name: Run backend tests
        run: npm test -- run

  # Builds the database from scratch on a throwaway Postgres (the version
  # Supabase runs), with every SQL file in supabase/migrations in order, then
  # signs in as a DM, players, an outsider and a signed-out visitor to check
  # the security rules (scripts/test-database.sh). Never touches the real
  # database.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build the database and check its rules
        run: scripts/test-database.sh
