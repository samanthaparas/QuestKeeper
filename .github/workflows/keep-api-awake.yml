# Keeps the API awake during Monday game night.
# Render's free plan puts the API to sleep after 15 minutes with no visitors,
# and waking it takes up to a minute. Pinging every 10 minutes stops that.
# Remove this file once the API is back on a paid plan (see render.yaml).
name: Keep API awake

on:
  schedule:
    # Times are UTC. Covers Monday 5 pm to midnight Central (daylight time)
    # and 4 pm to 11 pm Central (standard time).
    - cron: "*/10 22-23 * * 1"
    - cron: "*/10 0-4 * * 2"
  # Lets you run it by hand from the Actions tab, e.g. for a one-off session.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        # Long timeout and retries, because the first ping may have to wake it.
        run: curl --fail --silent --show-error --max-time 90 --retry 2 https://questkeeper-api.onrender.com/
