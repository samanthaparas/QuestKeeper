services:
  - type: web
    name: questkeeper-api
    runtime: node
    plan: free # back on free while Render fixes 502s on Starter; switch back when fixed
    rootDir: questkeeper-backend
    buildCommand: npm ci --workspaces=false
    startCommand: npm start
    healthCheckPath: /

  - type: web
    name: questkeeper
    runtime: static
    rootDir: questkeeper-frontend
    buildCommand: npm install --workspaces=false && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
